name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: Android64
          os: ubuntu-latest
          target: Android64

        - name: Android32
          os: ubuntu-latest
          target: Android32

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.config.name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write
    concurrency:
      group: package-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Build installers
        env:
          OUT: ${{ steps.build.outputs.build-output }}
        run: |
          MOD_ID="$(jq -r .id mod.json)"
          GEODE_FILE="$OUT/$MOD_ID.geode"
          if [ ! -f "$GEODE_FILE" ]; then
            GEODE_FILE="$(find "$OUT" -maxdepth 1 -type f -name '*.geode' | head -n 1)"
          fi
          if [ -z "$GEODE_FILE" ] || [ ! -f "$GEODE_FILE" ]; then
            echo "::error::No .geode file found in $OUT"
            exit 1
          fi
          rm -rf dist
          bash installer/build-installers.sh "$GEODE_FILE" dist
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: dist/

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          HEAD_SHA="$(git ls-remote origin "$GITHUB_REF" 2>/dev/null | awk -v r="$GITHUB_REF" '$2 == r { print $1; exit }')"
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha 2>/dev/null || true)"
          fi
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::Could not look up the current commit of $GITHUB_REF_NAME, so the release was not updated."
            exit 1
          fi
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::Release not updated: $GITHUB_REF_NAME now points to $HEAD_SHA, not to this run's commit $GITHUB_SHA."
            exit 0
          fi
          VERSION="$(jq -r .version mod.json)"
          TAG="v${VERSION#v}"
          MOD_ID="$(jq -r .id mod.json)"
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<'EOF'
          ## How to install

          Close Geometry Dash first.

          **Windows:** download **RhythmPath-Installer-Windows.bat** below and double-click it. It finds Geometry Dash, installs Geode if it is missing, and installs the mod.

          - If your browser warns about the download, choose **Keep** (in Edge: **...** > **Keep**, then **Show more** > **Keep anyway**).
          - If Windows says "Windows protected your PC", click **More info**, then **Run anyway**.
          - If Windows blocks the file without a **Run anyway** button (Smart App Control), right-click it > **Properties** > tick **Unblock** > **OK**, then double-click it again.
          - Or install by hand: copy **__MOD_ID__.geode** into the `geode\mods` folder inside your Geometry Dash folder (Geode must already be installed: https://geode-sdk.org/install).

          **macOS / Linux:** download **RhythmPath-Installer-macOS-Linux.sh**, then run it from a terminal:

          ```
          bash ~/Downloads/RhythmPath-Installer-macOS-Linux.sh
          ```

          Geode must already be installed on macOS and Linux: https://geode-sdk.org/install

          **Android:** download **__MOD_ID__.geode** and copy it into `Android/media/com.geode.launcher/game/geode/mods/` on your device, then restart the game.
          EOF
          sed -i "s/__MOD_ID__/$MOD_ID/g" "$NOTES"
          printf '\nBuilt from %s.\n' "$GITHUB_SHA" >> "$NOTES"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Rhythm Path $TAG" \
            --notes-file "$NOTES" \
            --latest
